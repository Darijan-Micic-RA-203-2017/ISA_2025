<!-- REFERENCE: https://material.angular.dev/components/card/overview -->
<mat-card id="accountActivationCard">
	<mat-card-header>
		<mat-card-title>Омогућавање деловања корисничког налога у систему Јутјубића</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<!-- REFERENCE: https://dev.to/vetriselvan_11/angular-20-control-flow-part-1-say-goodbye-to-ngif-ngfor-and-ngswitch-42d8 -->
		@if (!hasAccountBeenActivated()) {
			<!-- REFERENCE: https://material.angular.dev/components/progress-spinner/overview -->
			<mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
		} @else {
			<!-- REFERENCES:
			https://material.angular.dev/components/icon/overview
			https://fonts.google.com/icons
			-->
			<mat-icon id="successfulActivationOfUserAccountIcon">done_outline</mat-icon>
			<h3>
				Вашем корисничком налогу успешно је омогућено деловање.
			</h3>
			<h3>
				Добро дошли на Јутјубић!
			</h3>
		}
	</mat-card-content>
	<mat-card-actions>
		<!-- REFERENCE: https://angular.love/angular-router-everything-you-need-to-know-about -->
		<button id="landingPageButton" type="button" matButton="text" [disabled]="!hasAccountBeenActivated()" routerLink="/">
			Почетна страница
		</button>
	</mat-card-actions>
</mat-card>
