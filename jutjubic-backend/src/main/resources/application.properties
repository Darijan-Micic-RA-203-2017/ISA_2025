spring.application.name=Jutjubic - back-end

secret-of-application=post-express-irvas-univerexport-2025-2026-b92-net-slash-sport-basketball-realgm-com-patike-cipele-gradska-linija-9-bb-elektronik
life-duration-of-token-in-milliseconds=3600000
name-of-auth-header=Authorization

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.initialization-mode=always
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/jutjubic
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
